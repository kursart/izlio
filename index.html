<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>izlio - Mobil</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0f0f13;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    #auth-screen {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #0f0f13;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      box-sizing: border-box;
      z-index: 100;
    }
    .brand {
      font-size: 32px;
      font-weight: 800;
      color: #ff3366;
      margin-bottom: 24px;
      letter-spacing: -1px;
    }
    input {
      width: 100%;
      max-width: 320px;
      padding: 12px 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #282832;
      background: #181820;
      color: #fff;
      font-size: 16px;
      outline: none;
      box-sizing: border-box;
    }
    input:focus { border-color: #ff3366; }
    button {
      width: 100%;
      max-width: 320px;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      background: #ff3366;
      color: #fff;
      margin-top: 4px;
    }
    #status { font-size: 13px; color: #888; margin-top: 14px; text-align: center; }

    /* Oynatıcı Ekranı */
    #player-screen {
      display: none;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }
    .top-bar {
      padding: 12px 16px;
      background: #14141a;
      border-bottom: 1px solid #282832;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
    }
    .room-tag { color: #ff3366; font-weight: 700; }
    .leave-btn { background: #2b141a; color: #ff4d6d; padding: 6px 10px; border-radius: 6px; font-size: 12px; border: none; font-weight: 600; }
    
    .video-container {
      flex: 1;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    video {
      width: 100%;
      max-height: 100%;
    }
    .chat-drawer {
      height: 180px;
      background: #14141a;
      border-top: 1px solid #282832;
      display: flex;
      flex-direction: column;
    }
    .messages-area {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      font-size: 13px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .msg { background: #1e1e26; padding: 6px 10px; border-radius: 6px; }
    .msg.system { background: transparent; color: #777; font-size: 11px; text-align: center; }
    .msg strong { color: #ff3366; }
    .chat-input-area {
      padding: 8px;
      display: flex;
      gap: 6px;
      border-top: 1px solid #282832;
    }
    .chat-input-area input { margin: 0; padding: 8px; font-size: 14px; }
    .chat-input-area button { margin: 0; width: 70px; padding: 8px; font-size: 14px; }
  </style>
</head>
<body>

  <!-- GİRİŞ EKRANI -->
  <div id="auth-screen">
    <div class="brand">izlio</div>
    <input type="text" id="usernameInput" placeholder="Kullanıcı Adı" />
    <input type="text" id="roomInput" placeholder="Oda Adı" />
    <input type="password" id="passwordInput" placeholder="Oda Parolası" />
    <button id="joinBtn">Odaya Bağlan</button>
    <div id="status">PC ile aynı Oda Adı ve Parolayı girin.</div>
  </div>

  <!-- OYNATICI VE SOHBET EKRANI -->
  <div id="player-screen">
    <div class="top-bar">
      <span>Oda: <span class="room-tag" id="displayRoomName">--</span></span>
      <button class="leave-btn" id="leaveBtn">Bağlantıyı Kes</button>
    </div>
    <div class="video-container">
      <!-- Örnek test videosu (Daha sonra doğrudan link bağlayacağız) -->
      <video id="mainVideo" controls playsinline src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"></video>
    </div>
    <div class="chat-drawer">
      <div class="messages-area" id="messagesArea"></div>
      <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Mesaj..." />
        <button id="sendBtn">Gönder</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
